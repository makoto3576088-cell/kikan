<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>基幹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --soft:#f4f4f5; --soft2:#e4e4e7;
  --fg:#18181b; --fg2:#52525b; --fg3:#a1a1aa; --line:#e4e4e7;
  --pri:#006FEE; --pri-soft:#e6f1fe; --ok:#17c964; --ok-soft:#e8faf0;
  --warn:#f5a524; --warn-soft:#fefce8; --danger:#f31260; --danger-soft:#fee7ef;
  --work:#7828c8; --priv:#f5a524;
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:Inter,"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri);text-decoration:none}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{max-width:380px;margin:0 auto;padding:96px 20px}
#login h1{font-size:22px;font-weight:700;margin:0 0 4px}
#login p{color:var(--fg2);margin:0 0 22px;font-size:13.5px}
#login input{margin-bottom:10px}
#login .err{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100%}
aside{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:#fafafa;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
.logo b{font-size:15px}.logo small{display:block;color:var(--fg3);font-size:11px;font-weight:400;line-height:1.2}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 11px;border-radius:var(--r-sm);color:var(--fg2);font-weight:500;text-align:left}
.navbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.navbtn:hover{background:var(--soft);color:var(--fg)}
.navbtn[aria-selected="true"]{background:var(--pri-soft);color:var(--pri)}
aside .spacer{flex:1}
aside .foot{padding:8px 10px;font-size:12px;color:var(--fg3);display:flex;justify-content:space-between;align-items:center}
aside .foot button{background:none;border:0;color:var(--fg3);font-size:12px;padding:2px 4px}
main{padding:28px 32px 120px;max-width:1040px;width:100%}
.page{display:none}.page[data-on="1"]{display:block}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.ph h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
.ph .sub{color:var(--fg2);font-size:13.5px}
h2{font-size:13px;font-weight:600;color:var(--fg2);margin:0 0 10px;letter-spacing:.01em}
h2 .n{color:var(--fg3);font-weight:500;margin-left:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.muted{color:var(--fg3);font-size:13px}
.empty{color:var(--fg3);padding:18px 0;font-size:13.5px;text-align:center}
.tabbar{display:none}

/* ---------- controls ---------- */
input[type=text],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  width:100%;background:var(--soft);border:2px solid transparent;border-radius:var(--r-sm);padding:10px 12px;outline:0;transition:background .12s,border-color .12s}
input:hover,select:hover,textarea:hover{background:#ececee}
input:focus,select:focus,textarea:focus{background:var(--bg);border-color:var(--fg)}
textarea{resize:vertical;min-height:84px}
.btn{border:0;background:var(--pri);color:#fff;border-radius:var(--r-sm);padding:9px 16px;font-weight:600;font-size:13.5px;transition:opacity .12s}
.btn:hover{opacity:.9}.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--soft);color:var(--fg)}
.btn.danger{background:none;color:var(--danger)}
.btn.block{width:100%;padding:12px}
.addrow{display:flex;gap:8px;margin-bottom:16px}
.addrow input{flex:1}
.seg{display:inline-flex;background:var(--soft);border-radius:var(--r-sm);padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:8px;font-size:13px;color:var(--fg2);font-weight:500}
.seg button[aria-pressed="true"]{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.tgl{border:0;background:var(--soft);border-radius:var(--r-sm);padding:7px 12px;font-size:13px;color:var(--fg2)}
.tgl[aria-pressed="true"]{background:var(--pri-soft);color:var(--pri)}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:500;background:var(--soft);color:var(--fg2)}
.chip.over{background:var(--danger-soft);color:var(--danger)}
.chip.doing{background:var(--pri-soft);color:var(--pri)}
.chip.trial{background:var(--warn-soft);color:#b7791f}.chip.active{background:var(--ok-soft);color:#0e8a46}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.work{background:var(--work)}.dot.private{background:var(--priv)}
.linkbtn{background:none;border:0;color:var(--pri);font-size:13px;padding:0;font-weight:500}
.rowbtn{background:none;border:0;color:var(--fg3);padding:2px 6px;font-size:12.5px;border-radius:6px;opacity:0;transition:opacity .12s}
.row:hover .rowbtn,.row:focus-within .rowbtn,.acc:hover .rowbtn{opacity:1}
@media (hover:none){.rowbtn{opacity:1}}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);transition:background .12s}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .title{font-weight:500;line-height:1.45;cursor:pointer}
.row .sub{color:var(--fg3);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;align-items:center}
.row.done .title{color:var(--fg3);text-decoration:line-through}
.chk{width:22px;height:22px;border:2px solid var(--soft2);border-radius:50%;background:#fff;flex:none;margin-top:2px;padding:0;display:grid;place-items:center;transition:all .15s}
.chk:hover{border-color:var(--pri)}
.chk[data-on="1"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.group{margin-bottom:20px}

/* ---------- home ---------- */
.greet{margin-bottom:18px}
.greet h1{font-size:26px;margin:0;letter-spacing:-.015em}
.greet .d{color:var(--fg2);font-size:14.5px}
.jbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:20px}
.jbox.need{border-color:var(--pri)}
.jbox textarea{min-height:76px;background:#fff;border-color:transparent}
.jbox textarea:focus{border-color:var(--fg)}
.jbox .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
.jbox .foot .muted{font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.kpi .l{color:var(--fg2);font-size:12.5px;margin-top:4px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px;margin-top:6px}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .col{width:100%;max-width:34px;background:var(--pri-soft);border-radius:6px 6px 3px 3px;position:relative;overflow:hidden;min-height:4px}
.bars .col i{position:absolute;left:0;right:0;bottom:0;background:var(--pri);border-radius:6px 6px 0 0}
.bars .day{font-size:11px;color:var(--fg3)}
.bars .b.today .day{color:var(--pri);font-weight:600}
.jl{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.jl:last-child{border-bottom:0}
.jl .body{flex:1;white-space:pre-wrap;word-break:break-word;min-width:0}
.jl .time{font-size:12px;color:var(--fg3);margin-top:2px}
.daylabel{font-size:12.5px;color:var(--fg2);font-weight:600;margin:16px 0 4px}

/* ---------- projects ---------- */
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
.pcard:hover{transform:translateY(-1px)}
.pcard .h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pcard .h b{font-size:15px;flex:1}
.pcard p{margin:0;color:var(--fg2);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.pcard .links{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.pcard .links a{font-size:12px;background:var(--pri-soft);padding:2px 9px;border-radius:99px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard.done{opacity:.55}

/* ---------- students ---------- */
.stu{display:grid;grid-template-columns:270px 1fr;gap:16px;align-items:start}
.stulist{display:flex;flex-direction:column;gap:6px}
.stuitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);cursor:pointer}
.stuitem[aria-selected="true"]{background:var(--pri-soft);border-color:transparent}
.stuitem .av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--fg2);display:grid;place-items:center;font-weight:600;flex:none}
.stuitem[aria-selected="true"] .av{background:var(--pri);color:#fff}
.stuitem .n{flex:1;min-width:0}.stuitem .n b{display:block}.stuitem .n small{color:var(--fg3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.karte h1{font-size:22px;margin:0}
.karte .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--fg2);font-size:13px;margin:4px 0 14px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:13.5px;margin:0 0 6px}
.kv dt{color:var(--fg3)}.kv dd{margin:0;white-space:pre-wrap}
.next{background:var(--pri-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;white-space:pre-wrap;margin:12px 0}
.next b{display:block;font-size:12px;color:var(--pri);margin-bottom:2px}
.lesson{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lesson:last-child{border-bottom:0}
.lesson .d{color:var(--fg3);font-size:12.5px;padding-top:2px}
.lesson .b{white-space:pre-wrap}.lesson .b small{display:block;color:var(--fg2);font-size:12.5px;margin-top:2px}
.lesson .b .hw{color:#b7791f}

/* ---------- money ---------- */
.cur{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.curcard .hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.curcard .hd b{font-size:13px;color:var(--fg2)}
.curcard .total{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.curcard .total small{font-size:13px;color:var(--fg3);font-weight:500;margin-left:4px}
.spark{width:100%;height:64px;margin:10px 0 4px}
.spark path{fill:none;stroke:var(--pri);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .area{fill:var(--pri-soft);stroke:none}
.spark circle{fill:var(--pri)}
.spark text{font-size:9px;fill:var(--fg3)}
.acc{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc .n{flex:1;font-weight:500;min-width:0}
.acc .n small{display:block;color:var(--fg3);font-size:11.5px;font-weight:400}
.acc .v{font-weight:600;text-align:right}
.acc .v small{display:block;color:var(--fg3);font-size:11px;font-weight:400}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.io div{background:var(--soft);border-radius:var(--r-sm);padding:10px 12px}
.io .l{font-size:12px;color:var(--fg2)}
.io .v{font-size:18px;font-weight:700}
.io .v.in{color:#0e8a46}.io .v.out{color:var(--danger)}
.goal .tr{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.goal .tr i{display:block;height:100%;background:var(--ok);border-radius:4px}
.goal .tr i.neg{background:var(--danger)}
.txrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);align-items:center;font-size:13.5px}
.txrow:last-child{border-bottom:0}
.txrow .d{color:var(--fg3);font-size:12.5px}
.txrow .m small{display:block;color:var(--fg3);font-size:11.5px}
.txrow .a{font-weight:600}.txrow .a.in{color:#0e8a46}
.tabs2{display:flex;gap:6px;margin-bottom:14px}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:16px;padding:0;width:min(540px,calc(100% - 24px));background:var(--panel);color:var(--fg);box-shadow:0 24px 70px rgba(0,0,0,.25);max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}
.mbody{padding:20px 22px 8px;max-height:calc(100vh - 130px);overflow:auto}
.mbody label{display:block;font-size:12px;color:var(--fg2);margin:12px 0 4px;font-weight:500}
.mbody .big{font-size:17px;font-weight:600;padding:10px 12px;margin-bottom:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 18px;gap:8px}
.mfoot>div{display:flex;gap:8px}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;font-size:13px;padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

/* ---------- mobile ---------- */
@media (max-width:759px){
  html,body{overflow-x:hidden}
  .app{grid-template-columns:1fr;min-width:0}
  main{min-width:0}
  .card,.kpi,.jbox{min-width:0}
  .ph{flex-wrap:wrap;align-items:center}
  .ph>div:last-child{display:flex;gap:8px;width:100%}
  .ph>div:last-child .btn{flex:1}
  .ph>.btn{margin-left:auto}
  .btn{padding:9px 12px}
  .txrow{grid-template-columns:56px 1fr auto;gap:8px}
  .acc .n{font-size:13.5px}
  .pcards{grid-template-columns:1fr}
  .tools{gap:6px}
  .karte{padding:14px}
  .karte>div:first-child{flex-direction:column}
  .karte>div:first-child>div:last-child{width:100%}
  .karte>div:first-child>div:last-child .btn{flex:1}
  .lesson{grid-template-columns:56px 1fr;gap:8px}
  .mbody{padding:16px 16px 4px}
  .mfoot{padding:10px 16px 14px}
  aside{display:none}
  main{padding:18px 16px calc(78px + env(safe-area-inset-bottom))}
  .grid,.cur{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi{padding:10px 12px}.kpi .v{font-size:22px}
  .ph h1{font-size:21px}
  .stu{grid-template-columns:1fr}
  .stulist{flex-direction:row;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .stuitem{flex:none;min-width:150px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
  .tabbar button{flex:1;min-width:0;border:0;background:none;padding:8px 0 7px;font-size:10px;color:var(--fg3);display:flex;flex-direction:column;align-items:center;gap:3px}
  .tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button[aria-selected="true"]{color:var(--pri);font-weight:600}
  .g2{grid-template-columns:1fr}
  dialog{width:calc(100% - 16px)}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></symbol>
  <symbol id="i-task" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-proj" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/></symbol>
  <symbol id="i-stu" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></symbol>
  <symbol id="i-money" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></symbol>
  <symbol id="i-journal" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 11h8M8 15h6"/></symbol>
</svg>

<div id="login">
  <h1>基幹</h1>
  <p>個人基幹システム</p>
  <input type="email" id="email" placeholder="メールアドレス" autocomplete="username">
  <input type="password" id="password" placeholder="パスワード" autocomplete="current-password">
  <button class="btn block" id="loginBtn">ログイン</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" class="app hidden">
<aside>
  <div class="logo"><div class="mark">基</div><div><b>基幹</b><small>個人基幹システム</small></div></div>
  <button class="navbtn" data-tab="home" aria-selected="true"><svg><use href="#i-home"/></svg>ホーム</button>
  <button class="navbtn" data-tab="tasks" aria-selected="false"><svg><use href="#i-task"/></svg>タスク</button>
  <button class="navbtn" data-tab="projects" aria-selected="false"><svg><use href="#i-proj"/></svg>プロジェクト</button>
  <button class="navbtn" data-tab="students" aria-selected="false"><svg><use href="#i-stu"/></svg>生徒</button>
  <button class="navbtn" data-tab="money" aria-selected="false"><svg><use href="#i-money"/></svg>資産</button>
  <button class="navbtn" data-tab="journal" aria-selected="false"><svg><use href="#i-journal"/></svg>ジャーナル</button>
  <div class="spacer"></div>
  <div class="foot"><span id="whoami"></span><button id="logoutBtn">ログアウト</button></div>
</aside>

<main>
  <!-- HOME -->
  <section class="page" id="tab-home" data-on="1">
    <div class="greet"><h1 id="greet"></h1><div class="d" id="todayLabel"></div></div>
    <div class="jbox" id="jbox">
      <textarea id="jQuick" placeholder="いま思っていること、あったこと"></textarea>
      <div class="foot"><span class="muted" id="jHint"></span><button class="btn" id="jQuickAdd" disabled>記録</button></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v" id="kToday">0</div><div class="l">今日やる</div></div>
      <div class="kpi"><div class="v" id="kOver">0</div><div class="l">期限超過</div></div>
      <div class="kpi"><div class="v" id="kRate">–</div><div class="l">今週の達成率</div></div>
    </div>
    <div class="grid">
      <div>
        <div class="card" style="margin-bottom:16px"><h2>今日やる <span class="n" id="todayN"></span></h2><div class="list" id="todayTasks"></div></div>
        <div class="card"><h2>期限が近い</h2><div class="list" id="soonTasks"></div></div>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px"><h2>今週の完了数 <span class="n" id="weekLabel"></span></h2><div class="bars" id="bars"></div></div>
        <div class="card"><h2>最近のジャーナル</h2><div id="jRecent"></div></div>
      </div>
    </div>
  </section>

<script>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
const TZ = 'Asia/Singapore', W = ['日','月','火','水','木','金','土'];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate = (d = new Date()) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit' }).format(d);
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00+08:00'); d.setUTCDate(d.getUTCDate() + n); return localDate(d); };

let tasks = [], projects = [], journal = [], students = [], lessons = [], accounts = [], balances = [], txs = [], recs = [], settings = {};
let filter = { scope: 'all', done: false }, stuFilter = 'active', selStu = null;

// ---------- auth ----------
$('#loginBtn').onclick = async () => {
  $('#loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#password').value });

});

}

// ---------- load ----------
async function loadAll() {
  const q = (t, o) => sb.from(t).select('*').order(o || 'created_at');
  const r = await Promise.all([q('tasks'), q('projects'), sb.from('journal').select('*').order('created_at', { ascending: false }),
    q('students'), q('lessons', 'date'), sb.from('accounts').select('*').order('sort_order'), q('balances', 'date'), q('transactions', 'date'), sb.from('recurring').select('*').order('name'), sb.from('settings').select('*').maybeSingle()]);
  const err = r.find(x => x.error); if (err) return fail(err.error);
  [tasks, projects, journal, students, lessons, accounts, balances, txs, recs] = r.slice(0, 9).map(x => x.data);
  settings = r[9].data || {};
  renderAll();
  try { const t = localStorage.getItem('kikan.tab'); if (t && !journalToday()) showTab('home'); else if (t) showTab(t); } catch (e) {}
}
function renderAll() { renderHome(); renderTasks(); renderProjects(); renderStudents(); renderMoney(); renderJournal(); }

// ---------- journal ----------
const journalToday = () => journal.some(j => j.entry_date === TODAY);
async function addJournal(ta, btn) {
  const body = ta.value.trim(); if (!body) return;
  btn.disabled = true;
  const { data, error } = await sb.from('journal').insert({ body }).select().single();
  if (error) { btn.disabled = false; return fail(error); }
  journal.unshift(data); ta.value = ''; renderJournal(); renderHome(); toast('記録しました');
}
$('#jQuick').addEventListener('input', () => $('#jQuickAdd').disabled = !$('#jQuick').value.trim());
$('#jBody').addEventListener('input', () => $('#jAdd').disabled = !$('#jBody').value.trim());
$('#jQuickAdd').onclick = () => addJournal($('#jQuick'), $('#jQuickAdd'));
$('#jAdd').onclick = () => addJournal($('#jBody'), $('#jAdd'));
async function delJournal(id) {
  if (!confirm('この記録を削除しますか？')) return;
  const { error } = await sb.from('journal').delete().eq('id', id); if (error) return fail(error);
  journal = journal.filter(x => x.id !== id); renderJournal(); renderHome();
}
function jRow(e) { return `<div class="jl"><div class="body">${esc(e.body)}<div class="time">${fmtTime(e.created_at)}</div></div><button class="rowbtn" style="opacity:1" onclick="delJournal('${e.id}')">削除</button></div>`; }
function renderJournal() {
  $('#jCount').textContent = `${journal.length} 件`;
  if (!journal.length) { $('#jList').innerHTML = '<div class="empty">まだ記録がありません</div>'; return; }
  let html = '', last = null;
  for (const e of journal) { if (e.entry_date !== last) { html += `<div class="daylabel">${e.entry_date === TODAY ? '今日 ' : ''}${fmtDate(e.entry_date)}</div>`; last = e.entry_date; } html += jRow(e); }
  $('#jList').innerHTML = html;
}

// ---------- tasks ----------
const taskSortDue = (a, b) => (a.due_date || '9') < (b.due_date || '9') ? -1 : (a.due_date || '9') > (b.due_date || '9') ? 1 : (a.created_at < b.created_at ? -1 : 1);
function taskRow(t, opts = {}) {
  const over = t.due_date && t.due_date < TODAY && t.status !== 'done';
  const p = projects.find(x => x.id === t.project_id);
  const sub = [`<span class="dot ${t.scope === 'private' ? 'private' : 'work'}"></span>`];
  if (t.status === 'doing') sub.push('<span class="chip doing">進行中</span>');
  if (t.due_date) sub.push(over ? `<span class="chip over">期限超過 ${fmtDate(t.due_date)}</span>` : `<span>期限 ${fmtDate(t.due_date)}</span>`);
  if (t.start_date && t.status !== 'done' && !opts.hideStart) sub.push(`<span>着手 ${fmtDate(t.start_date)}</span>`);
  if (t.est_min) sub.push(`<span>${t.est_min}分</span>`);
  if (p) sub.push(`<span>${esc(p.name)}</span>`);
  return `<div class="row ${t.status === 'done' ? 'done' : ''}">
    <button class="chk" data-on="${t.status === 'done' ? 1 : 0}" onclick="toggleTask('${t.id}')" aria-label="完了">${t.status === 'done' ? chk : ''}</button>
    <div class="t"><div class="title" onclick="openTask('${t.id}')">${esc(t.title)}</div><div class="sub">${sub.join('')}</div></div>
    <button class="rowbtn" onclick="openTask('${t.id}')">編集</button></div>`;
}
async function toggleTask(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  const patch = t.status === 'done' ? { status: 'todo', done_at: null } : { status: 'done', done_at: new Date().toISOString() };
  const { error } = await sb.from('tasks').update(patch).eq('id', id); if (error) return fail(error);
  Object.assign(t, patch); renderAll();
}
async function quickAdd() {
  const v = $('#quickAdd').value.trim(); if (!v) return;
  $('#quickAdd').value = '';
  const { data, error } = await sb.from('tasks').insert({ title: v, scope: filter.scope === 'private' ? 'private' : 'work' }).select().single();
  if (error) return fail(error);
  tasks.push(data); renderAll(); toast('追加しました');
}
$('#quickAddBtn').onclick = quickAdd;
$('#quickAdd').addEventListener('keydown', e => { if (e.key === 'Enter') quickAdd(); });
$$('[data-f]').forEach(b => b.onclick = () => {
  if (b.dataset.f === 'scope') { filter.scope = b.dataset.v; $$('[data-f="scope"]').forEach(x => x.setAttribute('aria-pressed', x === b)); }
  else { filter.done = !filter.done; b.setAttribute('aria-pressed', filter.done); }
  renderTasks();
});
let editingTask = null;
function openTask(id) {
  editingTask = tasks.find(x => x.id === id); const f = $('#taskForm');
  f.elements.project_id.innerHTML = '<option value="">なし</option>' + projects.filter(p => p.status !== 'done' || p.id === editingTask.project_id).map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  for (const k of ['title','scope','status','due_date','start_date','est_min','project_id','memo']) f.elements[k].value = editingTask[k] ?? '';
  $('#taskDlg').showModal();
}
$('#taskSave').onclick = async () => {
  const f = $('#taskForm'); if (!f.reportValidity()) return;
  const patch = { title: f.elements.title.value.trim(), scope: f.elements.scope.value, status: f.elements.status.value,
    due_date: f.elements.due_date.value || null, start_date: f.elements.start_date.value || null,
    est_min: f.elements.est_min.value ? +f.elements.est_min.value : null, project_id: f.elements.project_id.value || null, memo: f.elements.memo.value };
  if (patch.status === 'done' && editingTask.status !== 'done') patch.done_at = new Date().toISOString();
  if (patch.status !== 'done') patch.done_at = null;
  const { error } = await sb.from('tasks').update(patch).eq('id', editingTask.id); if (error) return fail(error);
  Object.assign(editingTask, patch); $('#taskDlg').close(); renderAll(); toast('保存しました');
};
$('#taskDel').onclick = async () => {
  if (!confirm('このタスクを削除しますか？')) return;
  const { error } = await sb.from('tasks').delete().eq('id', editingTask.id); if (error) return fail(error);
  tasks = tasks.filter(x => x.id !== editingTask.id); $('#taskDlg').close(); renderAll();
};
function renderTasks() {
  let l = tasks.slice(); if (filter.scope !== 'all') l = l.filter(t => t.scope === filter.scope);
  const open = l.filter(t => t.status !== 'done'), done = l.filter(t => t.status === 'done');
  $('#taskCount').textContent = `未完了 ${open.length} 件`;
  const used = new Set(); const g = [];
  const pick = (name, fn) => { const x = open.filter(t => !used.has(t.id) && fn(t)); x.forEach(t => used.add(t.id)); g.push([name, x]); };
  pick('今日', t => (t.start_date && t.start_date <= TODAY) || (t.due_date && t.due_date <= TODAY));
  pick('今週', t => (t.start_date && t.start_date <= SUN) || (t.due_date && t.due_date <= SUN));
  pick('あとで', t => t.start_date || t.due_date);

}

// ---------- money ----------
const monthsBack = n => { const out = []; const [y, m] = TODAY.split('-').map(Number); for (let i = n - 1; i >= 0; i--) out.push(new Date(Date.UTC(y, m - 1 - i, 1)).toISOString().slice(0, 7)); return out; };
const monthsBetween = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
function latestBal(accId, upTo) { let b = null; for (const x of balances) { if (x.account_id !== accId || x.date > upTo) continue; if (!b || x.date > b.date) b = x; } return b; }
function projected(acc, upTo = TODAY) {
  const b = latestBal(acc.id, upTo); if (!b) return null;
  let v = +b.amount;
  txs.filter(t => t.account_id === acc.id && t.date > b.date && t.date <= upTo).forEach(t => v += +t.amount);
  const n = monthsBetween(ym(b.date), ym(upTo));
  recs.filter(r => r.account_id === acc.id).forEach(r => { v += (r.kind === 'in' ? 1 : -1) * +r.amount * n; });
  return { value: v, asOf: b.date, est: n > 0 || txs.some(t => t.account_id === acc.id && t.date > b.date) };
}
function spark(points) {
  const vals = points.map(p => p.v).filter(v => v !== null); if (!vals.length) return '<div class="empty" style="padding:10px 0">残高を記録すると推移が出ます</div>';
  const Wd = 320, H = 64, px = 8; const mn = Math.min(...vals), mx = Math.max(...vals); const sp = mx - mn || 1;
  const xy = points.map((p, i) => [px + i * (Wd - 2 * px) / (points.length - 1), p.v === null ? null : H - 10 - (p.v - mn) / sp * (H - 24)]);
  const seg = xy.filter(p => p[1] !== null); const d = seg.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = seg.length > 1 ? `M${seg[0][0]} ${H - 6} ` + seg.map(p => `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ') + ` L${seg[seg.length - 1][0]} ${H - 6} Z` : '';
  return `<svg class="spark" viewBox="0 0 ${Wd} ${H}" preserveAspectRatio="none">${area ? `<path class="area" d="${area}"/>` : ''}<path d="${d}"/>${seg.length ? `<circle cx="${seg[seg.length - 1][0]}" cy="${seg[seg.length - 1][1]}" r="3"/>` : ''}${points.map((p, i) => `<text x="${xy[i][0]}" y="${H}" text-anchor="middle">${+p.m.slice(5)}月</text>`).join('')}</svg>`;
}
function renderMoney() {
  const cm = ym(TODAY); $('#txMonthLabel').textContent = `${+cm.slice(5)}月`;
  const months = monthsBack(6);
  $('#curCards').innerHTML = ['SGD', 'JPY'].map(c => {
    const accs = accounts.filter(a => a.currency === c);
    const cur = accs.map(a => projected(a)); const total = cur.some(x => x) ? cur.reduce((s, x) => s + (x ? x.value : 0), 0) : null;
    const pts = months.map(m => { const vs = accs.map(a => projected(a, m === cm ? TODAY : monthEnd(m))); return { m, v: vs.some(x => x) ? vs.reduce((s, x) => s + (x ? x.value : 0), 0) : null }; });
    const mt = txs.filter(t => ym(t.date) === cm && accounts.find(a => a.id === t.account_id)?.currency === c);
    const inc = mt.filter(t => +t.amount > 0).reduce((s, t) => s + +t.amount, 0), out = mt.filter(t => +t.amount < 0).reduce((s, t) => s + +t.amount, 0);
    const g = c === 'SGD' ? settings.goal_sgd : settings.goal_jpy; const net = inc + out; const pct = g ? Math.max(0, Math.min(100, net / g * 100)) : null;
    return `<div class="card curcard"><div class="hd"><b>${c}</b><span class="muted">${accs.length} 口座</span></div>
      <div class="total">${total === null ? '–' : fmtAmt(total, c)}${cur.some(x => x && x.est) ? '<small>推定</small>' : ''}</div>
      ${spark(pts)}
      <div style="margin-top:8px">${accs.map(a => { const p = projected(a); return `<div class="acc"><div class="n">${esc(a.name)}<small>${esc(a.sub || '')}</small></div><div class="v">${p ? fmtAmt(p.value, c) : '–'}<small>${p ? (p.est ? '推定 · ' : '') + '記録 ' + fmtDate(p.asOf) : '未記録'}</small></div><button class="rowbtn" onclick="openBal('${a.id}')">記録</button></div>`; }).join('')}</div>
      <div class="io"><div><div class="l">今月の収入</div><div class="v in">${inc ? '+' + fmtAmt(inc, c) : '–'}</div></div><div><div class="l">今月の支出</div><div class="v out">${out ? '−' + fmtAmt(out, c) : '–'}</div></div></div>
      <div class="goal"><div style="display:flex;justify-content:space-between;font-size:13px"><span class="muted">目標 ${g ? fmtAmt(g, c) + '／月' : '未設定'}</span><span>${g ? `残し ${net < 0 ? '−' : ''}${fmtAmt(net, c)}（${Math.round(net / g * 100)}%）` : ''}</span></div>${g ? `<div class="tr"><i class="${net < 0 ? 'neg' : ''}" style="width:${pct}%"></i></div>` : ''}</div>
    </div>`; }).join('');
  const mt = txs.filter(t => ym(t.date) === cm).sort((a, b) => a.date < b.date ? 1 : -1);
  $('#txList').innerHTML = mt.length ? mt.map(t => { const a = accounts.find(x => x.id === t.account_id); const c = a?.currency || 'SGD'; return `<div class="txrow"><div class="d">${fmtDate(t.date)}</div><div class="m">${esc(t.memo)}<small>${esc(a?.name || '')}${t.category ? ' · ' + esc(t.category) : ''}</small></div><div><span class="a ${+t.amount > 0 ? 'in' : ''}">${+t.amount > 0 ? '+' : '−'}${fmtAmt(t.amount, c)}</span> <button class="rowbtn" style="opacity:1" onclick="openTx('${t.id}')">編集</button></div></div>`; }).join('') : '<div class="empty">今月の記録はまだありません</div>';
  $('#recList').innerHTML = recs.length ? recs.map(r => { const a = accounts.find(x => x.id === r.account_id); const c = a?.currency || 'JPY'; return `<div class="acc"><div class="n">${esc(r.name)}<small>${esc(a?.name || '')}${r.day ? ' · 毎月' + r.day + '日' : ' · 毎月'}</small></div><div class="v">${r.kind === 'in' ? '+' : '−'}${fmtAmt(r.amount, c)}</div><button class="rowbtn" onclick="openRec('${r.id}')">編集</button></div>`; }).join('') : '<div class="empty" style="padding:8px 0">なし</div>';
  $('#goalBox').innerHTML = `<div class="muted">SGD ${settings.goal_sgd ? fmtAmt(settings.goal_sgd, 'SGD') : '未設定'} ／ JPY ${settings.goal_jpy ? fmtAmt(settings.goal_jpy, 'JPY') : '未設定'}</div>`;
}

  $('#recDel').hidden = !editingRec; $('#recDlg').showModal();
}
$('#addRec').onclick = () => openRec(null);
$('#recSave').onclick = async () => {
  const f = $('#recForm'); if (!f.reportValidity()) return;
  const rec = { account_id: f.elements.account_id.value, name: f.elements.name.value.trim(), kind: f.elements.kind.value, amount: +f.elements.amount.value, day: f.elements.day.value ? +f.elements.day.value : null };
  if (editingRec) { const { error } = await sb.from('recurring').update(rec).eq('id', editingRec.id); if (error) return fail(error); Object.assign(editingRec, rec); }
  else { const { data, error } = await sb.from('recurring').insert(rec).select().single(); if (error) return fail(error); recs.push(data); }
  $('#recDlg').close(); renderMoney(); toast('保存しました');
};
$('#recDel').onclick = async () => {
  if (!confirm('削除しますか？')) return;
  const { error } = await sb.from('recurring').delete().eq('id', editingRec.id); if (error) return fail(error);
  recs = recs.filter(r => r.id !== editingRec.id); $('#recDlg').close(); renderMoney();
};
$('#editGoal').onclick = () => { const f = $('#goalForm'); f.elements.goal_sgd.value = settings.goal_sgd || ''; f.elements.goal_jpy.value = settings.goal_jpy || ''; $('#goalDlg').showModal(); };
$('#goalSave').onclick = async () => {
  const f = $('#goalForm');
  const rec = { goal_sgd: f.elements.goal_sgd.value ? +f.elements.goal_sgd.value : null, goal_jpy: f.elements.goal_jpy.value ? +f.elements.goal_jpy.value : null };
  const { data: { user } } = await sb.auth.getUser();
  const { data, error } = await sb.from('settings').upsert({ user_id: user.id, ...rec }).select().single(); if (error) return fail(error);
  settings = data; $('#goalDlg').close(); renderMoney(); toast('保存しました');
};
</script>
</body>
</html>
